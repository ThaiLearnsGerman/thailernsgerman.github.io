<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson Detail | ThaiLearnsGerman</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">ThaiLearnsGerman</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="lessons.html">Lessons</a>
      <a href="start.html">Start</a>
    </nav>
  </header>

  <main class="lesson-detail-page">
    <section id="lessonDetailContainer" class="lesson-detail-wrap">
      <p class="loading-text">Loading lesson...</p>
    </section>
  </main>

  <div class="chatbot-fab" id="chatToggle">💬</div>

  <div class="chatbot-window" id="chatWindow">
    <div class="chatbot-header">
      <div>
        <strong>Hans der Lehrer</strong>
        <span>ThaiLearnsGerman assistant</span>
      </div>
      <button id="chatClose">✕</button>
    </div>

    <div class="chatbot-body">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-message bot">
          <div class="chat-bubble">
            สวัสดี 👋 ฉันคือ <strong>Hans der Lehrer</strong><br><br>
            ถามได้เลยเรื่องคำทักทายภาษาเยอรมัน การเริ่มเรียน หรือคำศัพท์พื้นฐานในบทนี้
          </div>
        </div>
      </div>

      <div class="chat-quick-actions">
        <button class="chat-quick-action" data-question="บทเรียนนี้เกี่ยวกับอะไร">บทเรียนนี้เกี่ยวกับอะไร</button>
        <button class="chat-quick-action" data-question="Hallo แปลว่าอะไร">Hallo คืออะไร</button>
        <button class="chat-quick-action" data-question="Guten Morgen คืออะไร">Guten Morgen คืออะไร</button>
        <button class="chat-quick-action" data-question="Wie geht's คืออะไร">Wie geht's คืออะไร</button>
        <button class="chat-quick-action" data-question="เริ่มจากตรงไหนดี">เริ่มจากตรงไหนดี</button>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="ถาม Hans der Lehrer..." />
        <button id="chatSend">Send</button>
      </div>
    </div>
  </div>

  <script src="lesson.js?v=11"></script>
  <script>
    const chatToggle = document.getElementById("chatToggle");
    const chatWindow = document.getElementById("chatWindow");
    const chatClose = document.getElementById("chatClose");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const chatSend = document.getElementById("chatSend");
    const quickActions = document.querySelectorAll(".chat-quick-action");
    const lessonContextEl = document.getElementById("lessonDetailContainer");

    function addMessage(text, sender = "bot") {
      const msg = document.createElement("div");
      msg.className = `chat-message ${sender}`;
      msg.innerHTML = `<div class="chat-bubble">${text}</div>`;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function getLessonContext() {
      const lessonTitle = lessonContextEl?.dataset?.lessonTitle || "";
      const lessonMiniLesson = lessonContextEl?.dataset?.lessonMiniLesson || "";
      return { lessonTitle, lessonMiniLesson };
    }

    function botReply(userText) {
      const text = userText.toLowerCase().trim();
      const { lessonTitle, lessonMiniLesson } = getLessonContext();
      const lessonText = `${lessonTitle} ${lessonMiniLesson}`.toLowerCase();

      const isGreetingLesson =
        lessonText.includes("hallo") ||
        lessonText.includes("guten morgen") ||
        lessonText.includes("guten abend") ||
        lessonText.includes("wie geht");

      if (
        text.includes("บทเรียนนี้") ||
        text.includes("lesson") ||
        text.includes("this lesson") ||
        text.includes("deze les")
      ) {
        if (isGreetingLesson) {
          return `
            <strong>บทเรียนนี้เกี่ยวกับ German greetings</strong> 👋<br><br>
            ในบทนี้คุณจะได้เรียนคำพื้นฐาน เช่น:<br>
            • <strong>Hallo</strong> = สวัสดี<br>
            • <strong>Guten Morgen</strong> = สวัสดีตอนเช้า<br>
            • <strong>Guten Abend</strong> = สวัสดีตอนเย็น<br>
            • <strong>Wie geht's?</strong> = สบายดีไหม<br><br>
            เหมาะมากสำหรับผู้เริ่มต้น
          `;
        }

        return `
          <strong>บทเรียนนี้เกี่ยวกับ:</strong><br><br>
          ${lessonTitle || "ภาษาเยอรมันพื้นฐาน"}<br><br>
          ฉันช่วยอธิบายคำในบทนี้แบบง่าย ๆ ได้
        `;
      }

      if (text.includes("guten morgen")) {
        return `
          <strong>Guten Morgen</strong> = สวัสดีตอนเช้า ☀️<br><br>
          ใช้ในตอนเช้า<br><br>
          <strong>ตัวอย่าง:</strong><br>
          Guten Morgen! Wie geht's?<br>
          = สวัสดีตอนเช้า สบายดีไหม
        `;
      }

      if (text.includes("guten abend")) {
        return `
          <strong>Guten Abend</strong> = สวัสดีตอนเย็น 🌙<br><br>
          ใช้ในตอนเย็น<br><br>
          <strong>ตัวอย่าง:</strong><br>
          Guten Abend!<br>
          = สวัสดีตอนเย็น
        `;
      }

      if (
        text.includes("สวัสดี") ||
        text.includes("hello") ||
        text.includes("hallo") ||
        text.includes("hi")
      ) {
        if (isGreetingLesson) {
          return `
            ในบทนี้คำสำคัญคือ:<br><br>
            <strong>Hallo</strong> = สวัสดี<br>
            <strong>Guten Morgen</strong> = สวัสดีตอนเช้า<br>
            <strong>Guten Abend</strong> = สวัสดีตอนเย็น<br><br>
            เริ่มจาก <strong>Hallo</strong> ก่อนง่ายที่สุด 👋
          `;
        }

        return `
          <strong>Hallo</strong> = สวัสดี 👋<br><br>
          ใช้ได้เกือบทุกสถานการณ์สำหรับผู้เริ่มต้น
        `;
      }

      if (
        text.includes("wie geht") ||
        text.includes("สบายดีไหม")
      ) {
        return `
          <strong>Wie geht's?</strong> = สบายดีไหม<br><br>
          ตอบง่าย ๆ ได้แบบนี้:<br>
          • <strong>Gut</strong> = ดี<br>
          • <strong>Sehr gut</strong> = ดีมาก<br>
          • <strong>Nicht schlecht</strong> = ไม่แย่<br><br>
          <strong>ตัวอย่าง:</strong><br>
          Wie geht's?<br>
          Gut, danke.
        `;
      }

      if (
        text.includes("danke") ||
        text.includes("ขอบคุณ")
      ) {
        return `
          <strong>Danke</strong> = ขอบคุณ 🙏<br><br>
          ถ้าอยากสุภาพขึ้น ใช้:<br>
          • <strong>Danke schön</strong><br>
          • <strong>Vielen Dank</strong><br><br>
          ถ้าจะตอบกลับ ใช้ <strong>Bitte</strong>
        `;
      }

      if (
        text.includes("ออกเสียง") ||
        text.includes("pronunciation") ||
        text.includes("uitspraak")
      ) {
        return `
          <strong>เคล็ดลับการออกเสียง</strong><br><br>
          ยังไม่ต้องเป๊ะตั้งแต่วันแรกก็ได้ 👍<br><br>
          เริ่มจากพูดให้ชัดก่อน เช่น:<br>
          • <strong>Hallo</strong><br>
          • <strong>Danke</strong><br>
          • <strong>Guten Morgen</strong><br><br>
          ก่อนอื่นเอาให้มั่นใจ แล้วค่อยพัฒนาเรื่องสำเนียง
        `;
      }

      if (
        text.includes("เริ่ม") ||
        text.includes("start") ||
        text.includes("begin") ||
        text.includes("เริ่มยังไง")
      ) {
        if (isGreetingLesson) {
          return `
            <strong>เริ่มจาก 3 คำนี้ก่อน:</strong><br><br>
            1. <strong>Hallo</strong> = สวัสดี<br>
            2. <strong>Guten Morgen</strong> = สวัสดีตอนเช้า<br>
            3. <strong>Wie geht's?</strong> = สบายดีไหม<br><br>
            <strong>Mini oefening:</strong><br>
            Hallo, wie geht's?
          `;
        }

        return `
          <strong>เริ่มเรียนภาษาเยอรมันแบบง่าย ๆ</strong><br><br>
          เริ่มจากคำสั้น ๆ ก่อน แล้วค่อยเปิด lesson เพิ่มทีละบท
        `;
      }

      if (
        text.includes("ไทย") ||
        text.includes("thai") ||
        text.includes("คนไทย")
      ) {
        return `
          แน่นอน 😊<br><br>
          หน้านี้ทำมาเพื่อช่วยให้คนไทยเรียนภาษาเยอรมันได้ง่ายขึ้น<br><br>
          บทเรียนนี้เน้นเรื่อง:<br>
          <strong>${lessonTitle || "ภาษาเยอรมันพื้นฐาน"}</strong>
        `;
      }

      if (text.includes("แปลว่าอะไร")) {
        return `
          ฉันช่วยอธิบายคำในบทนี้ได้ 🙌<br><br>
          ลองถามแบบนี้:<br>
          • Hallo คืออะไร<br>
          • Guten Morgen คืออะไร<br>
          • Wie geht's คืออะไร<br>
          • Danke คืออะไร
        `;
      }

      if (
        text.includes("เยอรมัน") ||
        text.includes("german") ||
        text.includes("เรียน")
      ) {
        return `
          ตอนนี้คุณอยู่ในบทเรียน:<br><br>
          <strong>${lessonTitle || "German lesson"}</strong><br><br>
          ฉันช่วยได้เรื่อง:<br>
          • คำศัพท์ในบทนี้<br>
          • ตัวอย่างประโยค<br>
          • คำอธิบายง่าย ๆ<br>
          • mini practice
        `;
      }

      return `
        <strong>Hans der Lehrer ช่วยคุณได้ในบทนี้</strong> 📘<br><br>
        ลองถามแบบนี้:<br>
        • บทเรียนนี้เกี่ยวกับอะไร<br>
        • Hallo คืออะไร<br>
        • Guten Morgen คืออะไร<br>
        • Wie geht's คืออะไร<br>
        • เริ่มจากตรงไหนดี
      `;
    }

    function sendMessage() {
      const value = chatInput.value.trim();
      if (!value) return;

      addMessage(value, "user");
      chatInput.value = "";

      setTimeout(() => {
        addMessage(botReply(value), "bot");
      }, 400);
    }

    if (chatToggle) {
      chatToggle.addEventListener("click", () => {
        chatWindow.classList.toggle("open");
      });
    }

    if (chatClose) {
      chatClose.addEventListener("click", () => {
        chatWindow.classList.remove("open");
      });
    }

    if (chatSend) {
      chatSend.addEventListener("click", sendMessage);
    }

    if (chatInput) {
      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    }

    quickActions.forEach((btn) => {
      btn.addEventListener("click", () => {
        const question = btn.dataset.question;
        addMessage(question, "user");
        setTimeout(() => {
          addMessage(botReply(question), "bot");
        }, 400);
      });
    });
  </script>
</body>
</html>
