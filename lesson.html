<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson Detail | ThaiLearnsGerman</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">ThaiLearnsGerman</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="lessons.html">Lessons</a>
      <a href="start.html">Start</a>
    </nav>
  </header>

  <main class="lesson-detail-page">
    <section id="lessonDetailContainer" class="lesson-detail-wrap">
      <p class="loading-text">Loading lesson...</p>
    </section>
  </main>

  <div class="chatbot-fab" id="chatToggle">💬</div>

  <div class="chatbot-window" id="chatWindow">
    <div class="chatbot-header">
      <div>
        <strong>German Helper Bot</strong>
        <span>ThaiLearnsGerman assistant</span>
      </div>
      <button id="chatClose">✕</button>
    </div>

    <div class="chatbot-body">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-message bot">
          <div class="chat-bubble">
            สวัสดี 👋 ฉันคือ German Helper Bot ถามได้เลยเรื่องคำทักทายภาษาเยอรมัน การเริ่มเรียน หรือบทเรียนพื้นฐาน
          </div>
        </div>
      </div>

      <div class="chat-quick-actions">
        <button class="chat-quick-action" data-question="บทเรียนนี้เกี่ยวกับอะไร">บทเรียนนี้เกี่ยวกับอะไร</button>
        <button class="chat-quick-action" data-question="Hallo แปลว่าอะไร">Hallo คืออะไร</button>
        <button class="chat-quick-action" data-question="Guten Morgen คืออะไร">Guten Morgen คืออะไร</button>
        <button class="chat-quick-action" data-question="Wie geht's คืออะไร">Wie geht's คืออะไร</button>
        <button class="chat-quick-action" data-question="เริ่มจากตรงไหนดี">เริ่มจากตรงไหนดี</button>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Ask something..." />
        <button id="chatSend">Send</button>
      </div>
    </div>
  </div>

  <script src="lesson.js?v=11"></script>
  <script>
    const chatToggle = document.getElementById("chatToggle");
    const chatWindow = document.getElementById("chatWindow");
    const chatClose = document.getElementById("chatClose");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const chatSend = document.getElementById("chatSend");
    const quickActions = document.querySelectorAll(".chat-quick-action");
    const lessonContextEl = document.getElementById("lessonDetailContainer");

    function addMessage(text, sender = "bot") {
      const msg = document.createElement("div");
      msg.className = `chat-message ${sender}`;
      msg.innerHTML = `<div class="chat-bubble">${text}</div>`;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function getLessonContext() {
      const lessonTitle = lessonContextEl?.dataset?.lessonTitle || "";
      const lessonMiniLesson = lessonContextEl?.dataset?.lessonMiniLesson || "";
      return { lessonTitle, lessonMiniLesson };
    }

    function botReply(userText) {
      const text = userText.toLowerCase().trim();
      const { lessonTitle, lessonMiniLesson } = getLessonContext();
      const lessonText = `${lessonTitle} ${lessonMiniLesson}`.toLowerCase();

      const isGreetingLesson =
        lessonText.includes("hallo") ||
        lessonText.includes("guten morgen") ||
        lessonText.includes("guten abend") ||
        lessonText.includes("wie geht");

      if (
        text.includes("บทเรียนนี้") ||
        text.includes("this lesson") ||
        text.includes("deze les") ||
        text.includes("lesson about") ||
        text.includes("waar gaat deze les over")
      ) {
        if (isGreetingLesson) {
          return `
            <strong>Deze les gaat over German greetings</strong> 👋<br><br>
            Je leert hier vooral basisbegroetingen zoals:<br>
            • <strong>Hallo</strong> = สวัสดี<br>
            • <strong>Guten Morgen</strong> = สวัสดีตอนเช้า<br>
            • <strong>Guten Abend</strong> = สวัสดีตอนเย็น<br>
            • <strong>Wie geht's?</strong> = สบายดีไหม<br><br>
            Dit is perfect voor beginners.
          `;
        }

        return `
          <strong>Deze les gaat over:</strong><br><br>
          ${lessonTitle || "basic German"}<br><br>
          Ik kan je ook woorden uit deze les apart uitleggen.
        `;
      }

      if (text.includes("guten morgen")) {
        return `
          <strong>Guten Morgen</strong> = สวัสดีตอนเช้า ☀️<br><br>
          Gebruik dit in de ochtend.<br><br>
          <strong>Voorbeeld:</strong><br>
          Guten Morgen! Wie geht's?<br>
          = Goedemorgen! Hoe gaat het?
        `;
      }

      if (text.includes("guten abend")) {
        return `
          <strong>Guten Abend</strong> = สวัสดีตอนเย็น 🌙<br><br>
          Gebruik dit in de avond.<br><br>
          <strong>Voorbeeld:</strong><br>
          Guten Abend, alles gut?<br>
          = Goedenavond, alles goed?
        `;
      }

      if (
        text.includes("สวัสดี") ||
        text.includes("hello") ||
        text.includes("hallo") ||
        text.includes("hi")
      ) {
        if (isGreetingLesson) {
          return `
            ใน lesson นี้คำสำคัญคือ:<br><br>
            <strong>Hallo</strong> = สวัสดี<br>
            <strong>Guten Morgen</strong> = สวัสดีตอนเช้า<br>
            <strong>Guten Abend</strong> = สวัสดีตอนเย็น<br><br>
            เริ่มจาก <strong>Hallo</strong> ก่อนง่ายที่สุด 👋
          `;
        }

        return `
          <strong>Hallo</strong> = สวัสดี 👋<br><br>
          ใช้ได้เกือบทุกสถานการณ์สำหรับผู้เริ่มต้น
        `;
      }

      if (
        text.includes("wie geht") ||
        text.includes("สบายดีไหม")
      ) {
        return `
          <strong>Wie geht's?</strong> = สบายดีไหม<br><br>
          Simpele antwoorden:
          <br>• <strong>Gut</strong> = ดี
          <br>• <strong>Sehr gut</strong> = ดีมาก
          <br>• <strong>Nicht schlecht</strong> = ไม่แย่
          <br><br>
          <strong>Mini practice:</strong><br>
          Vraag: Wie geht's?<br>
          Antwoord: Gut, danke.
        `;
      }

      if (
        text.includes("danke") ||
        text.includes("thanks") ||
        text.includes("thank you") ||
        text.includes("ขอบคุณ")
      ) {
        return `
          <strong>Danke</strong> = ขอบคุณ 🙏<br><br>
          Netter:
          <br>• <strong>Danke schön</strong> = heel erg bedankt
          <br>• <strong>Vielen Dank</strong> = hartelijk dank
          <br><br>
          Antwoord:
          <br>• <strong>Bitte</strong> = alsjeblieft / graag gedaan
        `;
      }

      if (
        text.includes("pronunciation") ||
        text.includes("uitspraak") ||
        text.includes("ausspraak") ||
        text.includes("ออกเสียง")
      ) {
        if (isGreetingLesson) {
          return `
            <strong>Uitspraak tip voor deze les</strong><br><br>
            Focus eerst op duidelijk spreken, niet op perfect klinken.<br><br>
            Bijvoorbeeld:
            <br>• <strong>Hallo</strong> → “hal-lo”
            <br>• <strong>Danke</strong> → “dan-ke”
            <br><br>
            Eerst vertrouwen, daarna perfectie 👍
          `;
        }

        return `
          <strong>Uitspraak tip</strong><br><br>
          Niet perfect vanaf dag 1 is oké.<br>
          Eerst duidelijke woorden, daarna pas fijne uitspraak.
        `;
      }

      if (
        text.includes("start") ||
        text.includes("begin") ||
        text.includes("เริ่ม") ||
        text.includes("เริ่มยังไง") ||
        text.includes("เริ่มเรียน") ||
        text.includes("hoe begin ik")
      ) {
        if (isGreetingLesson) {
          return `
            <strong>Begin met deze 3 woorden uit deze les:</strong><br><br>
            1. <strong>Hallo</strong> = สวัสดี<br>
            2. <strong>Guten Morgen</strong> = สวัสดีตอนเช้า<br>
            3. <strong>Wie geht's?</strong> = สบายดีไหม<br><br>
            <strong>Mini oefening:</strong><br>
            Zeg: Hallo, wie geht's?
          `;
        }

        return `
          <strong>Start German step by step</strong><br><br>
          Begin met korte woorden en 1 simpele les tegelijk.<br>
          Niet te veel ineens.
        `;
      }

      if (
        text.includes("thai") ||
        text.includes("ไทย") ||
        text.includes("คนไทย")
      ) {
        return `
          แน่นอน 😊<br><br>
          Deze pagina is gebouwd voor <strong>Thai learners</strong> die Duits rustig en duidelijk willen leren.<br><br>
          Huidige lesfocus:<br>
          <strong>${lessonTitle || "German basics"}</strong>
        `;
      }

      if (
        text.includes("wat betekent") ||
        text.includes("meaning") ||
        text.includes("แปลว่าอะไร")
      ) {
        return `
          Ik kan woorden uit deze les uitleggen 🙌<br><br>
          Probeer bijvoorbeeld:
          <br>• Hallo
          <br>• Guten Morgen
          <br>• Wie geht's?
          <br>• Danke
        `;
      }

      if (
        text.includes("lesson") ||
        text.includes("learn") ||
        text.includes("german") ||
        text.includes("เยอรมัน") ||
        text.includes("เรียน")
      ) {
        return `
          Je zit nu in deze les:<br><br>
          <strong>${lessonTitle || "German lesson"}</strong><br><br>
          Ik kan je helpen met:
          <br>• woordbetekenissen
          <br>• simpele voorbeelden
          <br>• beginnersuitleg
          <br>• mini practice
        `;
      }

      return `
        <strong>Ik help je met deze les</strong> 📘<br><br>
        Probeer een van deze vragen:
        <br>• บทเรียนนี้เกี่ยวกับอะไร
        <br>• Hallo แปลว่าอะไร
        <br>• Guten Morgen คืออะไร
        <br>• Wie geht's คืออะไร
        <br>• เริ่มจากตรงไหนดี
      `;
    }

    function sendMessage() {
      const value = chatInput.value.trim();
      if (!value) return;

      addMessage(value, "user");
      chatInput.value = "";

      setTimeout(() => {
        addMessage(botReply(value), "bot");
      }, 400);
    }

    if (chatToggle) {
      chatToggle.addEventListener("click", () => {
        chatWindow.classList.toggle("open");
      });
    }

    if (chatClose) {
      chatClose.addEventListener("click", () => {
        chatWindow.classList.remove("open");
      });
    }

    if (chatSend) {
      chatSend.addEventListener("click", sendMessage);
    }

    if (chatInput) {
      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    }

    quickActions.forEach((btn) => {
      btn.addEventListener("click", () => {
        const question = btn.dataset.question;
        addMessage(question, "user");
        setTimeout(() => {
          addMessage(botReply(question), "bot");
        }, 400);
      });
    });
  </script>
</body>
</html>
